<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de itens</title>
    <link rel="stylesheet" href="Cadastro_Cliente.css">
</head>
<body>
      <h1>Cadastro de itens</h1>
  <div>
    <form action="Itens da nota.php" method="post">
        
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" name="descricao" required>
        <p></p>

        <label for="codigo">Código do produto</label>
        <input type="codigo" id="codigo" name="codigo" required>
        <p></p>
        
        <label for="valor">Nome da empresa</label>
        <input type="text" id="nome" name="nome" required >
        <p></p>

        <label for="preco">Preço do produto</label>
        <input type="preco" id="preco" name="preco" required >
        <p></p>
        
        <label for="forma">Forma de pagamento</label>
        <input type="text" id="forma" name="forma" required>
        <p></p>

        <label for="quantidade">Quantidade</label>
        <input type="quantidade" id="quantidade" name="quantidade" required>
        <p></p>
        <input class="form" type="submit" value="Cadastrar">
    </form>
  </div>
    
</body>
</html>
