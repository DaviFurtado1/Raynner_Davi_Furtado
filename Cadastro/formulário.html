<!DOCTYPE html>
<html lang="pt-br">

<head>
<link rel="stylesheet" href="formulario.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>

<body>
    <h1 class="h1">Cadastro de pessoas</h1>
    <div class="div">

        <form class="form" action="formulário.php" method="post">
            
            <label class="input" name for="nome">Nome completo:</label>
            <input class="input" type="text" id="nome" name="nome" required>
            <br><br>
            <label class="input" for="email">Email:</label>
            <input class="input" type="email" id="email" name="email" required>
            <br><br>
            <label class="input" for="telefone">Telefone:</label>
            <input class="input" type="tel" id="telefone" name="telefone" required>
            <br><br>
            <label class="input" for="Data de nascimento">Data de nascimento:</label>
            <input class="input" type="date" id="data" name="data" required>
            <br><br>
            <label class="input" for="cpf">CPF:</label>
            <input class="input" type="text" id="cpf" name="cpf" required>
            <br><br>
            <label class="input" for="endereco">Endereço:</label>
            <input class="input" type="text" id="endereco" name="endereco" required>
            <br><br>
            <h1>Estado</h1>
            <select id="estado" name="estado">
                <option class="option" value="selecione">Selecione...</option>
                <option class="option" value="São Paulo">São Paulo</option>
                <option class="option" value="Bahia">Bahia</option>
                <option class="option" value="Rio de Janeiro">Rio de janeiro</option>
                <option class="option" value="Minas Gerais">Minas Gerais</option>
                <br><br>
            </select>
            <br><br>
            <h1>Possui alguma deficincia?</h1>
            <input id="deficiencia-sim" type="radio" name="deficiencia" value="sim">Sim <br><br>
            <input id="deficiencia-nao" type="radio" name="deficiencia" value="nao">Não
            <br><br>
            <h1>Escolaridade <br></h1>
            <select id="escolaridade" name="escolaridade">
                <option class="option" value="selecione">Selecione...</option>
                <option class="option" value="Superior">Superior completo</option>
                <option class="option" value="Médio">Ensino médio completo</option>
                <option class="option" value="Fundamental">Fundamental completo</option>
                <option class="option" value="Incompleto">Incompleto</option>
                <br><br>
            </select>
            <br><br>
            <input class="form" type="submit" value="Cadastrar">
        </form>
    </div>
</body>

</html>
